name: CI

# Deploy stays a manual, locally-run flow (`npm run ship`), so CI never
# needs Cloudflare or Supabase secrets injected into GitHub Actions - it
# only ever runs a plain Next.js build, not the Cloudflare-specific ones.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # cloudflare-env.d.ts is generated and gitignored, but tsc needs the
      # ambient KVNamespace/CloudflareEnv types it declares: without this step
      # every typecheck on CI fails on names that exist on any machine that
      # has run cf-typegen. `wrangler types` derives everything from
      # wrangler.toml offline, no account or secret involved.
      - name: Generate Cloudflare env types
        run: npm run cf-typegen

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
